<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="40" fill="#14160a" rx="6" ry="6"/>
  <rect x="0" y="20" width="800" height="20" fill="#14160a"/>
  <text x="20" y="26" fill="#fafafa" font-weight="600" font-size="13">Model</text>
  <text x="200" y="26" fill="#fafafa" font-weight="600" font-size="13">Boundary</text>
  <text x="460" y="26" fill="#fafafa" font-weight="600" font-size="13">Attack Surface</text>
  <text x="640" y="26" fill="#fafafa" font-weight="600" font-size="13">Who Uses It</text>

  <!-- Row 1 -->
  <rect x="0" y="40" width="800" height="44" fill="#2a140f"/>
  <text x="20" y="66" fill="#fafafa" font-weight="600">Containers (runc)</text>
  <text x="200" y="66" fill="#cfcfd6">Shared kernel, namespace separation</text>
  <text x="460" y="66" fill="#ff6b5e" font-weight="600">~300+ syscalls</text>
  <text x="640" y="66" fill="#cfcfd6">Docker, Daytona</text>

  <!-- Row 2 -->
  <rect x="0" y="84" width="800" height="44" fill="#20201a"/>
  <text x="20" y="110" fill="#fafafa" font-weight="600">gVisor</text>
  <text x="200" y="110" fill="#cfcfd6">Intercepts syscalls in userspace</text>
  <text x="460" y="110" fill="#ffb357" font-weight="600">~237 syscalls</text>
  <text x="640" y="110" fill="#cfcfd6">Modal</text>

  <!-- Row 3 -->
  <rect x="0" y="128" width="800" height="44" fill="#14160a"/>
  <text x="20" y="154" fill="#fafafa" font-weight="600">MicroVMs (Firecracker)</text>
  <text x="200" y="154" fill="#cfcfd6">Separate kernel, hardware boundary</text>
  <text x="460" y="154" fill="#c4f000" font-weight="600">~25 KVM hypercalls</text>
  <text x="640" y="154" fill="#cfcfd6">E2B, Fly Sprites</text>

  <!-- Row 4 -->
  <rect x="0" y="172" width="800" height="44" fill="#14160a" rx="0" ry="0"/>
  <rect x="0" y="196" width="800" height="20" fill="#14160a" rx="6" ry="6"/>
  <text x="20" y="198" fill="#fafafa" font-weight="600">Full VMs</text>
  <text x="200" y="198" fill="#cfcfd6">Separate kernel, full hypervisor</text>
  <text x="460" y="198" fill="#c4f000" font-weight="600">Hypervisor surface</text>
  <text x="640" y="198" fill="#cfcfd6">Traditional clouds</text>

  <!-- Border -->
  <rect x="0" y="0" width="800" height="216" fill="none" stroke="#2b2b33" stroke-width="1" rx="6" ry="6"/>
</svg>
