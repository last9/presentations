<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="520" fill="#0f0f14" rx="8"/>

  <!-- Title -->
  <text x="40" y="32" fill="#eaeaf0" font-size="16" font-weight="700">Credentials in the Snapshot</text>
  <text x="40" y="52" fill="#b4b4be" font-size="12">Same engineering primitive (snapshot guest RAM to disk), different threat model</text>

  <!-- Left panel: without confidential computing -->
  <g>
    <!-- Panel frame -->
    <rect x="40" y="80" width="420" height="400" fill="#16161b" stroke="#33333c" stroke-width="1.2" rx="6"/>
    <!-- Header bar -->
    <rect x="40" y="80" width="420" height="48" fill="#221c0c" stroke="#33333c" stroke-width="1.2" rx="6"/>
    <rect x="40" y="116" width="420" height="12" fill="#221c0c" stroke="none"/>
    <text x="60" y="101" fill="#8b4a1a" font-size="13" font-weight="700">Without confidential computing</text>
    <text x="60" y="119" fill="#a07050" font-size="10" font-style="italic">e.g., Demo 1: c8i.large + Firecracker</text>

    <!-- Step 1: Guest VM -->
    <rect x="120" y="140" width="260" height="60" fill="#14223a" stroke="#6b6b78" stroke-width="1.2" rx="4"/>
    <text x="250" y="160" fill="#eaeaf0" font-size="12" font-weight="700" text-anchor="middle">Guest VM</text>
    <text x="250" y="180" fill="#eaeaf0" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">TIMBRE_TOKEN=SECRET_TIMBRE_…</text>
    <text x="250" y="194" fill="#b4b4be" font-size="10" text-anchor="middle">(in kernel cmdline, init env, dmesg, journal)</text>

    <!-- Arrow -->
    <line x1="250" y1="208" x2="250" y2="232" stroke="#6b6b78" stroke-width="1.6"/>
    <polygon points="250,238 245,230 255,230" fill="#6b6b78"/>
    <text x="262" y="226" fill="#b4b4be" font-size="10" font-style="italic">snapshot/create</text>

    <!-- Step 2: Memfile -->
    <rect x="120" y="244" width="260" height="60" fill="#16161b" stroke="#ffb357" stroke-width="1.6" rx="4"/>
    <text x="250" y="264" fill="#eaeaf0" font-size="12" font-weight="700" text-anchor="middle">memfile.mem on host disk</text>
    <text x="250" y="284" fill="#eaeaf0" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">…SECRET_TIMBRE_2026… (plaintext)</text>
    <text x="250" y="298" fill="#a3a3ad" font-size="10" text-anchor="middle">256 MB raw RAM dump · no encryption · CRC only</text>

    <!-- Arrow -->
    <line x1="250" y1="312" x2="250" y2="336" stroke="#6b6b78" stroke-width="1.6"/>
    <polygon points="250,342 245,334 255,334" fill="#6b6b78"/>
    <text x="262" y="330" fill="#b4b4be" font-size="10" font-style="italic">strings | grep</text>

    <!-- Step 3: Host reads -->
    <rect x="120" y="348" width="260" height="70" fill="#16161b" stroke="#ffb357" stroke-width="1.6" rx="4"/>
    <text x="250" y="368" fill="#eaeaf0" font-size="12" font-weight="700" text-anchor="middle">Host operator</text>
    <text x="250" y="388" fill="#eaeaf0" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">$ strings snap.mem | grep -c SECRET</text>
    <text x="250" y="406" fill="#ff6b5e" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">65</text>

    <!-- Caption -->
    <text x="250" y="448" fill="#8b4a1a" font-size="11" text-anchor="middle">Token recoverable in 65 distinct memory regions.</text>
    <text x="250" y="464" fill="#a3a3ad" font-size="10" text-anchor="middle">Documented Firecracker behavior, not a bug.</text>
  </g>

  <!-- Right panel: with SEV-SNP -->
  <g>
    <!-- Panel frame -->
    <rect x="500" y="80" width="420" height="400" fill="#16161b" stroke="#33333c" stroke-width="1.2" rx="6"/>
    <!-- Header bar -->
    <rect x="500" y="80" width="420" height="48" fill="#14160a" stroke="#33333c" stroke-width="1.2" rx="6"/>
    <rect x="500" y="116" width="420" height="12" fill="#14160a" stroke="none"/>
    <text x="520" y="101" fill="#c4f000" font-size="13" font-weight="700">With AMD SEV-SNP</text>
    <text x="520" y="119" fill="#a9d96b" font-size="10" font-style="italic">e.g., Demo 2: m6a.large with AmdSevSnp=enabled</text>

    <!-- Step 1: Guest VM with SEV-SNP -->
    <rect x="580" y="140" width="260" height="60" fill="#14160a" stroke="#c4f000" stroke-width="1.6" rx="4"/>
    <text x="710" y="160" fill="#eaeaf0" font-size="12" font-weight="700" text-anchor="middle">Guest VM (SEV-SNP, VMPL0)</text>
    <text x="710" y="180" fill="#eaeaf0" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">TIMBRE_TOKEN=SECRET_TIMBRE_…</text>
    <text x="710" y="194" fill="#b4b4be" font-size="10" text-anchor="middle">(in same places, but RAM is hardware-encrypted)</text>

    <!-- Arrow -->
    <line x1="710" y1="208" x2="710" y2="232" stroke="#6b6b78" stroke-width="1.6"/>
    <polygon points="710,238 705,230 715,230" fill="#6b6b78"/>
    <text x="722" y="226" fill="#b4b4be" font-size="10" font-style="italic">snapshot/create</text>

    <!-- Step 2: Encrypted memfile -->
    <rect x="580" y="244" width="260" height="60" fill="#16161b" stroke="#c4f000" stroke-width="1.6" rx="4"/>
    <text x="710" y="264" fill="#eaeaf0" font-size="12" font-weight="700" text-anchor="middle">memfile.mem on host disk</text>
    <text x="710" y="284" fill="#eaeaf0" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">0x9af3c2 81d04e b76210 … (ciphertext)</text>
    <text x="710" y="298" fill="#a3a3ad" font-size="10" text-anchor="middle">per-VM key in AMD PSP · host never holds it</text>

    <!-- Arrow -->
    <line x1="710" y1="312" x2="710" y2="336" stroke="#6b6b78" stroke-width="1.6"/>
    <polygon points="710,342 705,334 715,334" fill="#6b6b78"/>
    <text x="722" y="330" fill="#b4b4be" font-size="10" font-style="italic">strings | grep</text>

    <!-- Step 3: Host reads -->
    <rect x="580" y="348" width="260" height="70" fill="#16161b" stroke="#c4f000" stroke-width="1.6" rx="4"/>
    <text x="710" y="368" fill="#eaeaf0" font-size="12" font-weight="700" text-anchor="middle">Host operator</text>
    <text x="710" y="388" fill="#eaeaf0" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">$ strings snap.mem | grep -c SECRET</text>
    <text x="710" y="406" fill="#c4f000" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">0</text>

    <!-- Caption -->
    <text x="710" y="448" fill="#c4f000" font-size="11" text-anchor="middle">Host reads ciphertext. Encryption protects from operator.</text>
    <text x="710" y="464" fill="#a3a3ad" font-size="10" text-anchor="middle">Does not protect from the guest's own code.</text>
  </g>

  <!-- Footer -->
  <text x="480" y="500" fill="#a3a3ad" font-size="10" font-style="italic" text-anchor="middle">Firecracker upstream docs: "cryptographic tokens may be replicated across multiple VMs resumed from the same snapshot."</text>
</svg>
