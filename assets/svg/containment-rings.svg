<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,monospace">
  <!-- concentric containment: each ring enforced by a layer BELOW the agent -->
  <g transform="translate(380 300)">
    <!-- ring 4: framework -->
    <circle r="288" fill="none" stroke="#242838" stroke-width="2"/>
    <circle r="288" fill="#7aa2f7" opacity="0.04"/>
    <!-- ring 3: database -->
    <circle r="222" fill="none" stroke="#2f3550" stroke-width="2"/>
    <circle r="222" fill="#7aa2f7" opacity="0.05"/>
    <!-- ring 2: crypto -->
    <circle r="156" fill="none" stroke="#3a4570" stroke-width="2"/>
    <circle r="156" fill="#7aa2f7" opacity="0.06"/>
    <!-- ring 1: kernel -->
    <circle r="92" fill="none" stroke="#3ddc97" stroke-width="2.5"/>
    <circle r="92" fill="#0f2620"/>

    <!-- the agent at the center (the untrusted thing) -->
    <circle r="44" fill="#2a1413" stroke="#ff5f56" stroke-width="2.5"/>
    <text y="-2" fill="#ff5f56" font-size="16" font-weight="700" text-anchor="middle">AGENT</text>
    <text y="18" fill="#ff8079" font-size="11" text-anchor="middle">untrusted</text>
  </g>

  <!-- labels: who enforces each ring -->
  <g font-size="16" font-weight="600">
    <text x="380" y="240" fill="#3ddc97" text-anchor="middle">kernel — Landlock + process group</text>
    <text x="380" y="176" fill="#9fb4ef" text-anchor="middle">crypto — per-agent AES-GCM keys</text>
    <text x="380" y="112" fill="#8aa0d8" text-anchor="middle">database — (workspace, agent) PK</text>
    <text x="380" y="48"  fill="#7f8aa8" text-anchor="middle">framework — budgets · audit · deploy</text>
  </g>

  <!-- hand annotation -->
  <text x="380" y="588" fill="#ffc56d" font-size="22" text-anchor="middle"
        font-family="'Shantell Sans Variable','Shantell Sans','Comic Sans MS',cursive">
    every ring is enforced below the agent — never by its code
  </text>
</svg>
